<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" routerLink="/home">AngleNet Library</a>

      <div class="navbar-nav ms-auto">

        <a class="nav-link" routerLink="/quotes" routerLinkActive="active">
          <i class="fa-solid fa-quote-left"></i>
          <span class="ms-1">My Quotes</span>
        </a>

        @if (authService.currentUser(); as user) {
          <a class="nav-link" routerLink="/profile" routerLinkActive="active">
            <i class="fa-solid fa-user"></i>
            <span class="ms-1">Profile</span>
          </a>
        } @else {
          <a class="nav-link" routerLink="/login" routerLinkActive="active">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span class="ms-1">Login</span>
          </a>
        }
        <button
          type="button"
          class="btn nav-link ms-3"
          title="Toggle dark mode"
          aria-label="Toggle dark mode"
          (click)="toggleDarkMode()"
        >
          <i class="fa-solid" [class.fa-moon]="!isDarkMode" [class.fa-sun]="isDarkMode"></i>
        </button>
      </div>
    </div>
  </nav>
</header>

<main class="container mt-4">
  <router-outlet />
</main>

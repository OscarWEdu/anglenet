<div class="container">
  <h1 class="mb-4">Books</h1>

  <div class="mb-4">
    <input
      type="search"
      class="form-control"
      placeholder="Search books by title..."
      [(ngModel)]="searchTerm"
    >
  </div>

    <div class="row g-4">
    @for (book of filteredBooks; track book.id) {
      <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2">
        <div
          class="book-card h-100"
          (click)="openBook(book)"
          role="button"
          tabindex="0"
        >
          <img
            [src]="book.imageUrl"
            [alt]="book.title"
            class="book-cover"
            loading="lazy"
          >

          <h2 class="book-title">
            {{ book.title }}
          </h2>
        </div>
      </div>
    }
  </div>

  @if (selectedBook) {
  <div class="book-overlay" (click)="closeBook()">
    <div
      class="book-details"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="btn-close book-close"
        aria-label="Close"
        (click)="closeBook()"
      ></button>

      <div class="row g-4">
        <div class="col-md-4">
          <img
            [src]="selectedBook.imageUrl"
            [alt]="selectedBook.title"
            class="book-details-cover"
          >
        </div>

        <div class="col-md-8">
          <h2>{{ selectedBook.title }}</h2>

          <p class="text-muted">
            Published {{ selectedBook.publicationDate }}
          </p>

          <p>
            {{ selectedBook.description }}
          </p>

          <p class="small text-muted">
            Last edited by {{ selectedBook.lastEditedBy }}
          </p>

          <div class="d-flex gap-2 mt-4">
            <span
              [attr.title]="authService.currentUser() ? null : 'You must be signed in to edit'"
            >
              <button
                type="button"
                class="btn btn-primary"
                [disabled]="!authService.currentUser()"
              >
                Edit
              </button>
            </span>

            <span
              [attr.title]="authService.currentUser() ? null : 'You must be signed in to delete'"
            >
              <button
                type="button"
                class="btn btn-danger"
                [disabled]="!authService.currentUser()"
              >
                Delete
              </button>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
}

</div>
